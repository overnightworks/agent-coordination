name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The token can never push, whatever the repository's default says (#530):
# a test that escapes its store fakes must not reach the live claim store.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Check source
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked pyright src tests scripts
      - name: Check for dead code
        run: test -n "$(find src -name '*.py' -print -quit)" && uv run --locked vulture src scripts/vulture_whitelist.py --min-confidence 60
      - name: Check root layout
        run: uv run --locked python scripts/check_root_layout.py
      - name: Check architecture contracts
        run: uv run --locked lint-imports
      - if: matrix.python != '3.12'
        run: uv run --locked pytest -n auto
      - if: matrix.python == '3.12'
        run: >-
          uv run --locked pytest -n auto --cov=agent_coordination --cov=aco_board --cov-branch
          --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered --cov-fail-under=100
      - if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  gates:
    name: Test-efficiency gates (test-budget, similar-methods, test-inventory, spec-lint)
    runs-on: ubuntu-latest
    steps:
      # Every gate measures against a merge-base, so the branch point must be reachable
      # (issue #319: the base-selection concept -- a change gate measures against the tree
      # it lands on).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      # similar_methods.py deliberately performs no network I/O of its own (a measurement
      # command stays offline); test_budget.py and test_inventory.py self-heal a missing
      # ref, but fetching once here keeps all three gates on the same known-fetched base.
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${GITHUB_BASE_REF}"
      - name: Test budget (tests/ size and duplication vs the merge-base)
        run: uv run --locked python scripts/test_budget.py --ci
      - name: Similar methods (cross-file near-duplicate functions vs the merge-base)
        run: uv run --locked python scripts/similar_methods.py --ci
      - name: Test inventory (rewritten-module assert-literal coverage vs the merge-base)
        run: uv run --locked python scripts/test_inventory.py --ci
      - name: Spec lint (specs/*.spec.md style rules, no baseline)
        run: uv run --locked python scripts/spec_lint.py --ci

  # The same script gates release.yml, so CI proves exactly what a release
  # uploads: wheel and sdist carry the committed board assets and install
  # with no Node on PATH.
  package:
    name: Package smoke (wheel, sdist, tool install without Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.11'
      - run: bash scripts/package_smoke.sh

  frontend:
    name: Frontend (svelte-check, lint, knip, vitest, assets fresh)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Lint and formatting
        run: pnpm lint
      - name: Check for unused files, exports and dependencies
        run: pnpm knip
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build into src/aco_board/static
        run: pnpm build
      # The board's assets are committed so a Python-only install needs no
      # Node; this gate proves the committed files are exactly what frontend/
      # builds. `git status --porcelain` also lists untracked and deleted
      # paths, which `git diff --exit-code` would miss.
      - name: Assets fresh
        working-directory: .
        run: |
          set -euo pipefail
          git ls-files --error-unmatch src/aco_board/static/index.html
          changed="$(git status --porcelain --untracked-files=all -- src/aco_board/static)"
          test -z "$changed" || { printf '%s\n' "$changed"; echo "::error::static assets differ from frontend/ build"; exit 1; }
      - name: Audit production dependencies
        run: pnpm audit --prod
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: frontend-coverage
          path: reports
          if-no-files-found: error

  e2e:
    name: E2E (Playwright, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: '3.12'
      # The fake board server (tests/aco_board/e2e_server.py) the launcher
      # spawns is the only Python side this job needs; no Node is involved.
      - run: uv sync --locked --group dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E specs (bootstrap, empty, unavailable, no-access -- desktop)
        working-directory: frontend
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  quality:
    needs: [check, gates, package, frontend, e2e]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@75467b7888ab8158dda370c770d3323dfc1f594e  # v0.1.1
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
