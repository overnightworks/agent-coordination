name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The token can never push, whatever the repository's default says (#530):
# a test that escapes its store fakes must not reach the live claim store.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - name: Verify the dependency lock
        run: uv lock --check
      - name: Check source
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check types
        run: uv run --locked pyright src tests scripts
      - name: Check for dead code
        run: test -n "$(find src -name '*.py' -print -quit)" && uv run --locked vulture src scripts/vulture_whitelist.py --min-confidence 60
      - name: Check root layout
        run: uv run --locked python scripts/check_root_layout.py
      - name: Check architecture contracts
        run: uv run --locked lint-imports
      - if: matrix.python != '3.12'
        run: uv run --locked pytest -n auto
      - if: matrix.python == '3.12'
        run: >-
          uv run --locked pytest -n auto --cov=agent_coordination --cov=aco_board --cov-report=xml:coverage.xml
          --cov-report=term-missing --cov-fail-under=100
      # pytest-cov's --cov-fail-under evaluates the combined line+branch number
      # once --cov-branch is on, so the blocking step above stays line-only.
      # This second, informational run measures branches on the side (issue
      # #317 Lane 2): it must not fail the job while the gap it reports is
      # still open, which is why it gets its own step and continue-on-error
      # instead of an extra flag on the step above.
      - name: Branch coverage (informational)
        if: matrix.python == '3.12'
        continue-on-error: true
        run: |
          uv run --locked pytest -n auto --cov=agent_coordination --cov=aco_board --cov-branch \
            --cov-report=json:coverage-branch.json
          python3 - <<'PYTHON'
          import json
          import os
          import sys

          report_path = "coverage-branch.json"
          if not os.path.exists(report_path):
              missing_message = (
                  "branch coverage report missing: "
                  "pytest did not produce coverage-branch.json"
              )
              print(missing_message)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary_file:
                  summary_file.write(missing_message + "\n")
              sys.exit(0)

          with open(report_path) as report_file:
              report = json.load(report_file)

          branch_percent = report["totals"]["percent_branches_covered"]
          print(f"Branch coverage: {branch_percent:.2f}%")

          worst_modules = sorted(
              report["files"].items(),
              key=lambda item: item[1]["summary"]["missing_branches"],
              reverse=True,
          )[:10]

          summary_lines = [
              "## Branch coverage (informational)",
              "",
              f"Total: {branch_percent:.2f}%",
              "",
              "Modules with the most uncovered branches:",
              "",
              "| Module | Missing branches | Branch % |",
              "| --- | ---: | ---: |",
          ]
          summary_lines += [
              f"| {path} | {file_info['summary']['missing_branches']} | "
              f"{file_info['summary']['percent_branches_covered']:.2f}% |"
              for path, file_info in worst_modules
          ]

          # Job summaries have no read API, so the table is echoed to the log
          # too -- otherwise this run's own evidence would be unreadable
          # outside the GitHub UI.
          print("\n".join(summary_lines))

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary_file:
              summary_file.write("\n".join(summary_lines) + "\n")
          PYTHON
      - if: ${{ !cancelled() && matrix.python == '3.12' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage.xml

  gates:
    name: Test-efficiency gates (test-budget, similar-methods, test-inventory, spec-lint)
    runs-on: ubuntu-latest
    steps:
      # Every gate measures against a merge-base, so the branch point must be reachable
      # (issue #319: the base-selection concept -- a change gate measures against the tree
      # it lands on).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      # similar_methods.py deliberately performs no network I/O of its own (a measurement
      # command stays offline); test_budget.py and test_inventory.py self-heal a missing
      # ref, but fetching once here keeps all three gates on the same known-fetched base.
      - name: Fetch the pull request's base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${GITHUB_BASE_REF}"
      - name: Test budget (tests/ size and duplication vs the merge-base)
        run: uv run --locked python scripts/test_budget.py --ci
      - name: Similar methods (cross-file near-duplicate functions vs the merge-base)
        run: uv run --locked python scripts/similar_methods.py --ci
      - name: Test inventory (rewritten-module assert-literal coverage vs the merge-base)
        run: uv run --locked python scripts/test_inventory.py --ci
      - name: Spec lint (specs/*.spec.md style rules, no baseline)
        run: uv run --locked python scripts/spec_lint.py --ci

  # The same script gates release.yml, so CI proves exactly what a release
  # uploads: wheel and sdist carry the committed board assets and install
  # with no Node on PATH.
  package:
    name: Package smoke (wheel, sdist, tool install without Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: '3.11'
      - run: bash scripts/package_smoke.sh

  frontend:
    name: Frontend (svelte-check, lint, knip, vitest, assets fresh)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm check
      - name: Lint and formatting
        run: pnpm lint
      - name: Check for unused files, exports and dependencies
        run: pnpm knip
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Build into src/aco_board/static
        run: pnpm build
      # The board's assets are committed so a Python-only install needs no
      # Node; this gate proves the committed files are exactly what frontend/
      # builds. `git status --porcelain` also lists untracked and deleted
      # paths, which `git diff --exit-code` would miss.
      - name: Assets fresh
        working-directory: .
        run: |
          set -euo pipefail
          git ls-files --error-unmatch src/aco_board/static/index.html
          changed="$(git status --porcelain --untracked-files=all -- src/aco_board/static)"
          test -z "$changed" || { printf '%s\n' "$changed"; echo "::error::static assets differ from frontend/ build"; exit 1; }
      - name: Audit production dependencies
        run: pnpm audit --prod
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-coverage
          path: reports
          if-no-files-found: error

  e2e:
    name: E2E (Playwright, desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: '3.12'
      # The fake board server (tests/aco_board/e2e_server.py) the launcher
      # spawns is the only Python side this job needs; no Node is involved.
      - run: uv sync --locked --group dev
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version-file: frontend/package.json
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright's Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E specs (bootstrap, empty, unavailable, no-access -- desktop)
        working-directory: frontend
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  quality:
    needs: [check, gates, package, frontend, e2e]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@75467b7888ab8158dda370c770d3323dfc1f594e  # v0.1.1
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
