<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entscheidungs-Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: album — tracklist left (grouped by Wichtigkeit or Vorhaben), the open decision right: "So ist es heute" once on top, option tiles below with their blocks aligned in rows (Soll · Beispiel · Folge · Zeitreise). 4 options: two in full comparison, two compact. Phone: list first, decision as own view, options as swipe cards with a sticky take bar. */
:root{
  --bg:#F3F2F6; --surface:#FFFFFF; --surface-2:#ECEAF1; --line:#E1DEE8; --line-strong:#C9C4D4;
  --fg:#17141F; --fg-2:#4D4759; --fg-3:#857E92;
  --accent:#8A2A63; --accent-soft:#F6E8F0; --accent-fg:#FFFFFF;
  --good:#1F7A52; --good-soft:#E2F2EA; --warn:#9A6514; --warn-soft:#F8EEDA; --crit:#C42F2F; --crit-soft:#FBE7E7;
  --shot-bg:#FFFFFF; --shot-2:#F4F3F7; --shot-3:#E6E3EC; --shot-line:#E3E0EA; --shot-fg:#1A1722; --shot-mute:#827B8F;
  --rim:#25212E;
  --term-bg:#151827; --term-2:#21263A; --term-fg:#E6E8F2; --term-dim:#8C92AB;
  --syn-kw:#E58FC0; --syn-str:#8FD6A8; --syn-fn:#F2C66E; --syn-com:#6F7690; --syn-num:#9DB8FF;
  --t-err:#FF8F7E; --t-warn:#F2C14E; --t-ok:#7FD79C;
  --shadow:0 18px 50px -24px rgba(23,20,31,.35);
  --font-display:'Schibsted Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-body:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:12px; --list:320px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F0E13; --surface:#18161E; --surface-2:#211F29; --line:#2A2733; --line-strong:#3B3746;
  --fg:#ECEAF1; --fg-2:#B0AABC; --fg-3:#7A7487;
  --accent:#E98BC0; --accent-soft:#2E1A27; --accent-fg:#160D13;
  --good:#5CC793; --good-soft:#12261C; --warn:#E2AE55; --warn-soft:#2A2113; --crit:#F07070; --crit-soft:#331719;
  --shot-bg:#1D1B24; --shot-2:#25222E; --shot-3:#302C3A; --shot-line:#332F3D; --shot-fg:#EEECF3; --shot-mute:#8D879A;
  --rim:#3A3646;
  --term-bg:#0B0D17; --term-2:#181C2C; --term-fg:#E6E8F2; --term-dim:#7F86A0;
  --shadow:0 20px 60px -20px rgba(0,0,0,.8); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0F0E13; --surface:#18161E; --surface-2:#211F29; --line:#2A2733; --line-strong:#3B3746;
  --fg:#ECEAF1; --fg-2:#B0AABC; --fg-3:#7A7487;
  --accent:#E98BC0; --accent-soft:#2E1A27; --accent-fg:#160D13;
  --good:#5CC793; --good-soft:#12261C; --warn:#E2AE55; --warn-soft:#2A2113; --crit:#F07070; --crit-soft:#331719;
  --shot-bg:#1D1B24; --shot-2:#25222E; --shot-3:#302C3A; --shot-line:#332F3D; --shot-fg:#EEECF3; --shot-mute:#8D879A;
  --rim:#3A3646;
  --term-bg:#0B0D17; --term-2:#181C2C; --term-fg:#E6E8F2; --term-dim:#7F86A0;
  --shadow:0 20px 60px -20px rgba(0,0,0,.8); color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none}
.app{min-height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* top bar */
.top{display:flex;align-items:center;gap:24px;padding-block:14px;padding-inline:16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font:700 17px/1 var(--font-display);letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.disc{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,var(--surface) 0 2px,var(--accent) 3px 5px,var(--fg) 6px 100%)}
.nav{display:flex;gap:4px;margin-inline:auto}
.nav button{padding:7px 14px;border-radius:999px;font-weight:500;color:var(--fg-2)}
.nav button[aria-current="page"]{background:var(--fg);color:var(--bg)}
.nav .count{font:500 11px var(--font-mono);margin-left:6px;opacity:.7}
.gear{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--fg-2)}
.gear:hover{background:var(--surface-2)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
/* tracklist */
.decide{display:grid;grid-template-columns:var(--list) minmax(0,1fr);flex:1;min-height:0}
.tracks{border-right:1px solid var(--line);background:var(--surface);padding-block:16px 32px;overflow:auto}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;margin-inline:16px;margin-bottom:14px}
.seg button{flex:1;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--fg-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.focusbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-inline:16px;margin-bottom:12px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--accent-soft)}
.focusbar b{font-weight:600}
.focusbar button{font-size:13px;font-weight:600;color:var(--accent);padding:4px 8px;border-radius:6px;display:inline-flex;gap:4px;align-items:center}
.tracks h2{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin:0;padding-inline:20px;padding-block:8px 8px;display:flex;justify-content:space-between}
.grp{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 20px 6px;font:600 13px var(--font-display);color:var(--fg);text-align:left}
.grp .n{font:500 11px var(--font-mono);color:var(--fg-3);display:inline-flex;gap:6px;align-items:center}
.grp:hover .n{color:var(--accent)}
.grp + .track,.grp ~ .track{}
.track{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:3px 10px;align-items:center;width:100%;text-align:left;padding:11px 20px;border-left:3px solid transparent}
.track:hover{background:var(--surface-2)}
.track[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.track .no{font:500 13px var(--font-mono);color:var(--fg-3);grid-row:span 2;align-self:start;padding-top:2px}
.track .t{font-weight:600;min-width:0;line-height:1.3}
.track .meta{grid-column:2;font-size:12.5px;color:var(--fg-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.track .meta svg{width:13px;height:13px}
.track .side{grid-row:span 2;display:flex;flex-direction:column;align-items:flex-end;gap:6px;align-self:start}
.track.waiting .t{color:var(--fg-3);font-weight:500}
.track.waiting .no{opacity:.5}
.waitchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--fg-3);font-weight:500}
.waitchip svg{width:12px;height:12px}
.sub-h{font:500 11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding:12px 20px 4px 51px}
.typ{display:inline-flex;align-items:center;gap:4px}
.stake{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.stake i{width:4px;border-radius:1px;background:var(--line-strong)}
.stake i:nth-child(1){height:5px}.stake i:nth-child(2){height:8px}.stake i:nth-child(3){height:12px}
.stake[data-s="1"] i:nth-child(1),.stake[data-s="2"] i:nth-child(-n+2),.stake[data-s="3"] i{background:var(--fg-2)}
.block{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--crit);font-weight:600}
.block::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.done-sec{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.done-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 10px;padding:9px 20px;align-items:center;color:var(--fg-2);cursor:pointer}
.done-row:hover{background:var(--surface-2)}
.done-row .chk{width:20px;height:20px;border-radius:50%;background:var(--good);color:var(--surface);display:grid;place-items:center;grid-row:span 2}
.done-row .chk svg{width:13px;height:13px}
.done-row .t{font-size:14px;font-weight:500;min-width:0}
.done-row .a{grid-column:2;font-size:12.5px;color:var(--fg-3)}
.linkbtn{font-size:13px;font-weight:600;color:var(--accent);grid-row:span 2;padding:4px 6px;border-radius:6px}
.linkbtn:hover{background:var(--accent-soft)}
.empty{padding:20px;color:var(--fg-3);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
/* stage */
.stage{overflow:auto;padding-block:28px 56px;padding-inline:clamp(16px,3vw,44px)}
.stage-in{max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
.back{display:none;align-items:center;gap:6px;color:var(--fg-2);font-weight:500;font-size:14px}
.eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--fg-3)}
.eyebrow b{color:var(--fg-2);font-weight:600}
.tchip{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--font-body);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg-2)}
.tchip svg{width:13px;height:13px}
.situation{font-size:17px;color:var(--fg-2);margin:0;max-width:65ch}
.question{font:700 clamp(26px,3vw,38px)/1.12 var(--font-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.waitbanner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:var(--r);padding:12px 16px;font-size:14px;color:var(--fg-2)}
.waitbanner svg{width:18px;height:18px;color:var(--fg-3)}
.waitbanner b{color:var(--fg)}
.waitbanner .linkbtn{margin-left:auto}
/* Ist band */
.ist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ist summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer}
.ist summary::-webkit-details-marker{display:none}
.ist summary .chev{margin-left:auto;color:var(--fg-3);transition:transform .15s}
.ist[open] summary .chev{transform:rotate(180deg)}
.ist-lab{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2);display:inline-flex;gap:8px;align-items:center}
.ist-lab::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--fg-3)}
.ist-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,var(--ist-w,640px));gap:24px;align-items:center;padding:0 18px 18px}
.ist-cap{font-size:16px;color:var(--fg);margin:0;max-width:40ch}
.ist-cap small{display:block;margin-top:8px;font-size:13px;color:var(--fg-3)}
.ist-body .scene.phone{max-width:300px}
/* options: aligned rows via subgrid */
.optsbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.optsbar h3{font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2);margin:0;display:inline-flex;gap:8px;align-items:center}
.optsbar h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.optsbar .info{margin-left:auto}
.tiles{display:grid;column-gap:18px;row-gap:0;grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}
.tile{grid-row:span 6;display:grid;grid-template-rows:subgrid;row-gap:0;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding-inline:16px;transition:box-shadow .15s,border-color .15s,transform .15s;min-width:0}
.tile:has(.tile-open:hover){box-shadow:var(--shadow);border-color:var(--line-strong);transform:translateY(-2px)}
.tile.rec{border:2px solid var(--accent);padding-inline:15px}
.tile-open{position:absolute;inset:0;z-index:1;border-radius:var(--r)}
.t-head{padding-block:18px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ans{font:600 18px/1.25 var(--font-display);text-wrap:balance}
.conf{display:flex;align-items:center;gap:8px}
.conf .bar{flex:1;max-width:120px;height:4px;border-radius:2px;background:var(--line)}
.conf .bar i{display:block;height:100%;border-radius:2px;background:var(--fg-3)}
.rec .conf .bar i{background:var(--accent)}
.pct{font:500 12.5px var(--font-mono);color:var(--fg-3);white-space:nowrap}
.rec-tag{position:absolute;top:-11px;left:14px;background:var(--accent);color:var(--accent-fg);font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px}
.choice-tag{position:absolute;top:-11px;left:14px;background:var(--good);color:var(--surface);font:600 11px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;display:inline-flex;gap:4px;align-items:center}
.choice-tag svg{width:12px;height:12px}
.tile.ro{cursor:default}
.tile.ro.dim{opacity:.55}
.t-cell{padding-bottom:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.t-cell:empty{padding:0}
.lab{font:600 10.5px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);display:flex;gap:8px;align-items:center}
.story{font-size:14px;color:var(--fg-2);margin:0;border-left:2px solid var(--line-strong);padding-left:10px}
.folge{font-size:14px;color:var(--fg);margin:0;display:flex;gap:6px}
.folge::before{content:"→";color:var(--fg-3)}
.t-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:12px 14px;border-top:1px solid var(--line);align-self:end}
.take{position:relative;z-index:2;padding:8px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px}
.take:hover{border-color:var(--fg)}
.rec .take{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
/* block icons: filled = present, dashed = missing but optional */
.bks{display:flex;gap:5px}
.bk{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--fg-2);color:var(--surface)}
.bk svg{width:14px;height:14px}
.bk.off{background:none;color:var(--fg-3);border:1.5px dashed var(--line-strong)}
/* Zeitreise compact */
.prog{font-style:normal;font:600 10.5px/1 var(--font-mono);letter-spacing:.04em;color:var(--warn);background:var(--warn-soft);padding:3px 6px;border-radius:4px;text-transform:none}
.zr{display:grid;grid-template-columns:repeat(3,1fr);list-style:none;margin:2px 0 4px;padding:0;position:relative;font-size:11.5px;color:var(--fg-3)}
.zr::before{content:"";position:absolute;left:6px;right:calc(33% - 6px);top:5px;border-top:2px solid var(--line-strong)}
.zr::after{content:"";position:absolute;left:calc(67% - 6px);right:calc(33% - 6px);top:5px;border-top:2px dashed var(--line-strong)}
.zr li{display:flex;flex-direction:column;gap:4px;position:relative;z-index:1}
.zr li::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--fg-3);box-shadow:0 0 0 3px var(--surface)}
.zr li.sel::before{background:var(--accent)}
.zr li.fut::before{background:var(--surface);border:2px dashed var(--warn)}
.zr li.fut{color:var(--warn);font-weight:600}
.zr-frame{margin:0;display:flex;flex-direction:column;gap:6px;position:relative}
.zr-frame .scene{border:1.5px dashed var(--warn)}
.zr-frame figcaption{font-size:13px;color:var(--fg-2)}
.stamp{position:absolute;top:8px;right:8px;z-index:1;font:600 10px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--warn);color:var(--surface);padding:4px 6px;border-radius:4px}
/* 4 options: comparison + compact rows */
.cmp-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cmp-pick label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg-3);min-width:0}
.cmp-pick select{flex:1;min-width:0;padding:6px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px}
.minis{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.mini{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);position:relative}
.mini:first-child{border-top:0}
.mini .thumb{grid-row:span 2;width:72px}
.mini .thumb .scene.phone{border-width:3px;border-radius:9px}
.mini .ans{font-size:15.5px}
.mini .row2{grid-column:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--fg-2)}
.mini .row2 .folge{font-size:13.5px}
.mini .side{grid-row:span 2;display:flex;gap:8px;align-items:center}
.mini .swap{position:relative;z-index:2;font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:999px;border:1px solid var(--line-strong)}
.mini:hover{background:var(--surface-2)}
.mini .take{padding:6px 12px;font-size:13px}
/* why + actions */
.why{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:14.5px;max-width:80ch}
.why b{color:var(--accent);flex:none;max-width:45%}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:16px}
.actions > button{padding:8px 14px;border-radius:999px;border:1px solid var(--line-strong);font-size:14px;font-weight:500;color:var(--fg-2);display:inline-flex;gap:6px;align-items:center}
.actions > button:hover,.actions > button[aria-expanded="true"]{background:var(--surface-2);color:var(--fg)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--fg-3);margin-left:auto;align-items:center}
.legend span.k{display:inline-flex;gap:5px;align-items:center}
.legend .bk{width:18px;height:18px;border-radius:5px}
.legend .bk svg{width:11px;height:11px}
.info{position:relative;display:inline-flex}
.legend .info{margin-left:auto}
.info-btn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--fg-3);color:var(--fg-3);font:600 11px/1 var(--font-display);display:grid;place-items:center;font-style:italic}
.info-pop{display:none;position:absolute;bottom:calc(100% + 8px);right:-6px;z-index:15;width:min(290px,80vw);background:var(--fg);color:var(--bg);font-size:13px;line-height:1.45;padding:10px 12px;border-radius:10px;box-shadow:var(--shadow);text-align:left}
.info:hover .info-pop,.info.open .info-pop,.info-btn:focus-visible + .info-pop{display:block}
.info-pop b{font-weight:600}
/* Mehr Info chooser */
.ask{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px;box-shadow:var(--shadow)}
.ask-h{font:600 15px var(--font-display)}
.ask-h small{display:block;font:400 13px var(--font-body);color:var(--fg-3)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:7px 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:13.5px;display:inline-flex;gap:6px;align-items:center}
.chips button svg{width:13px;height:13px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ask textarea{width:100%;min-height:70px;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:var(--surface);resize:vertical}
.ask-foot{display:flex;gap:8px;justify-content:flex-end}
.btn-p{background:var(--fg);color:var(--bg);font-weight:600;padding:10px 20px;border-radius:999px}
.btn-p.rec{background:var(--accent);color:var(--accent-fg)}
.btn-p:disabled{opacity:.4;cursor:default}

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sized = (icon, px) => icon.replace('class="i"', `class="i" style="width:${px}px;height:${px}px"`);
const stakeMark = s => `<span class="stake" data-s="${s}" title="Einsatz ${STAKE[s]}"><i></i><i></i><i></i></span>`;
const byId = id => D.find(d => d.id === id) ?? HIST.find(h => h.id === id);
const phoneQuery = matchMedia('(max-width:760px)');
const isPhone = () => phoneQuery.matches;

const state = {view:'decide', openId:null, phoneOpen:false, done:[], mode:'prio', focus:null,
  ovIdx:null, ovFrame:'soll', askOpen:false, ask:new Set(), cmp:{}, slide:0, toastTimer:null, readOnly:null};

/* ---------- read-only viewing of a decided decision ---------- */
const STATE_LABEL = {offen:'noch nicht umgesetzt', arbeit:'in Arbeit', um:'umgesetzt', end:'endgültig'};
const roState = d => d.state || 'offen';
function chosenIdx(d){
  if (d.chosen !== undefined) return d.chosen;
  return state.done.find(x => x.id === d.id)?.idx ?? d.rec;
}

/* ---------- blocks: what each option carries, what the decision demands ---------- */
const picSlot = d => d.ist ? 'istsoll' : 'bild';
const slotsOf = d => [picSlot(d), 'bsp', 'folge', 'zeit'];
const presentOf = (d,o) => new Set([...(o.soll?[picSlot(d)]:[]), ...(o.ex?['bsp']:[]), 'folge', ...(o.zeit?['zeit']:[])]);
function requiredText(d){
  const req = ['Folge'];
  if (IST_TYPES.has(d.type)) req.push('Ist/Soll');
  if (d.stake >= 2) req.push(d.ist ? 'Ist/Soll oder Beispiel' : 'Bild oder Beispiel');
  if (d.stake === 3) req.push('Zeitreise');
  return [...new Set(req)].join(' · ');
}
const blockRow = (d,o) => { const has = presentOf(d,o); return `<span class="bks" aria-label="Bausteine">${slotsOf(d).map(b =>
  `<span class="bk${has.has(b)?'':' off'}" title="${BLOCK_LABEL[b]}${has.has(b)?'':' fehlt (freiwillig)'}">${ICON[b]}</span>`).join('')}</span>`; };
const infoTip = (id, html) => `<span class="info" data-info="${id}"><button class="info-btn" aria-label="Erklärung" aria-expanded="false">i</button><span class="info-pop" role="tooltip">${html}</span></span>`;

/* ---------- tracklist ---------- */
const isDone = id => state.done.some(x => x.id === id);
const rank = d => (d.blocked?100:0) + d.stake*10;
function ordered(){
  const open = D.filter(d => !isDone(d.id));
  const active = open.filter(d => !d.waiting).sort((a,b) => rank(b)-rank(a));
  return [...active, ...open.filter(d => d.waiting)];
}
function trackRow(d, n){
  const meta = d.waiting
    ? `<span class="waitchip">${ICON.wait}wartet auf ${d.waiting.to}</span>`
    : `<span class="typ">${TYPE[d.type].icon}${d.type}</span>`;
  return `<button class="track${d.waiting?' waiting':''}" data-id="${d.id}" aria-current="${d.id===state.openId}">
    <span class="no">${String(n).padStart(2,'0')}</span><span class="t">${esc(d.title)}</span>
    <span class="side">${d.waiting?'':stakeMark(d.stake)}${d.blocked&&!d.waiting?'<span class="block">blockiert</span>':''}</span>
    <span class="meta">${state.mode==='prio'&&!state.focus?d.proj+' · ':''}${meta}</span></button>`;
}
function groupRows(list, numbers){
  const active = list.filter(d => !d.waiting), waiting = list.filter(d => d.waiting);
  return active.map(d => trackRow(d, numbers.get(d.id))).join('')
    + (waiting.length ? `<div class="sub-h">Wartet auf Agent</div>` + waiting.map(d => trackRow(d, numbers.get(d.id))).join('') : '');
}
function renderTracks(){
  const all = ordered();
  const numbers = new Map(all.map((d,i) => [d.id, i+1]));
  const visible = state.focus ? all.filter(d => d.proj === state.focus) : all;
  if (!state.readOnly && !visible.some(d => d.id === state.openId)) state.openId = (visible.find(d => !d.waiting) ?? visible[0])?.id ?? null;
  document.getElementById('openCount').textContent = all.filter(d => !d.waiting).length || '';
  let body;
  if (!visible.length) body = `<div class="empty">${state.focus?`Für ${esc(state.focus)} ist nichts offen.`:'Nichts offen. Neue Fragen erscheinen hier, sobald ein Agent eine stellt.'}${state.focus?`<button class="linkbtn" data-unfocus>Alle zeigen</button>`:''}</div>`;
  else if (state.mode === 'proj' && !state.focus){
    const projects = [...new Set(all.map(d => d.proj))];
    body = projects.map(p => { const items = all.filter(d => d.proj === p);
      return `<button class="grp" data-focus="${p}" title="Nur ${p} zeigen"><span>${p}</span><span class="n">${items.filter(d=>!d.waiting).length} offen ${sized(ICON.next,12)}</span></button>${groupRows(items, numbers)}`; }).join('');
  } else body = `<h2><span>${state.focus?'Offen':'Offen'}</span><span class="mono">${visible.filter(d=>!d.waiting).length}</span></h2>${groupRows(visible, numbers)}`;
  const done = state.done.map(x => { const d = byId(x.id); return `<div class="done-row" data-viewro="${d.id}"><span class="chk">${ICON.check}</span><span class="t">${esc(d.title)}</span>
    <button class="linkbtn" data-change="${d.id}">Ändern</button><span class="a">${esc(d.opts[x.idx].a)}</span></div>`; }).join('');
  document.getElementById('tracks').innerHTML = `
    <div class="seg" role="group" aria-label="Sortierung"><button data-mode="prio" aria-pressed="${state.mode==='prio'}">Nach Wichtigkeit</button><button data-mode="proj" aria-pressed="${state.mode==='proj'}">Nach Vorhaben</button></div>
    ${state.focus?`<div class="focusbar"><span>Nur <b>${esc(state.focus)}</b></span><button data-unfocus>${sized(ICON.close,13)} Alle</button></div>`:''}
    ${body}
    ${done?`<div class="done-sec"><h2><span>Erledigt heute</span></h2>${done}</div>`:''}`;
}

/* ---------- option tiles ---------- */
function zeitCompact(d,o){
  return `<span class="lab">Zeitreise <em class="prog">Prognose ${o.p} %</em></span>
    <ol class="zr" aria-label="heute, gewählt, in 4 Wochen"><li>heute</li><li class="sel">gewählt</li><li class="fut">in 4 Wochen</li></ol>
    <figure class="zr-frame"><span class="stamp">Prognose</span>${scene(o.zeit.scene)}<figcaption>${esc(o.zeit.cap)}</figcaption></figure>`;
}
function tile(d, i){
  const o = d.opts[i], ro = state.readOnly === d.id, chosen = ro && i === chosenIdx(d), rec = !ro && i === d.rec;
  return `<article class="tile${rec?' rec':''}${ro?' ro':''}${ro&&!chosen?' dim':''}" data-tile="${i}">
    ${ro?'':`<button class="tile-open" data-opt="${i}" aria-label="${esc(o.a)} groß ansehen"></button>`}
    <div class="t-head">${chosen?`<span class="choice-tag">${ICON.check}Deine Wahl</span>`:rec?'<span class="rec-tag">Empfohlen</span>':''}<span class="ans">${esc(o.a)}</span><span class="conf"><span class="bar"><i style="width:${o.p}%"></i></span><span class="pct">${o.p} %</span></span></div>
    <div class="t-cell">${o.soll?`<span class="lab">${d.ist?'So soll es sein':'Bild'}</span>${scene(o.soll)}`:''}</div>
    <div class="t-cell">${o.ex?`<span class="lab">Beispiel</span><p class="story">${esc(o.ex)}</p>`:''}</div>
    <div class="t-cell"><span class="lab">Folge</span><p class="folge">${esc(o.f)}</p></div>
    <div class="t-cell">${o.zeit?zeitCompact(d,o):''}</div>
    <div class="t-foot">${blockRow(d,o)}${ro?'':`<button class="take" data-take="${i}">Nehmen</button>`}</div>
  </article>`;
}
const byConfidence = d => d.opts.map((o,i) => i).sort((a,b) => (b===d.rec)-(a===d.rec) || d.opts[b].p - d.opts[a].p);
function comparePair(d){ return state.cmp[d.id] ??= byConfidence(d).slice(0,2); }
function optionsBlock(d){
  const n = d.opts.length;
  if (state.readOnly === d.id) return `<div class="tiles" style="--n:${n}" data-n="${n}">${d.opts.map((o,i) => tile(d,i)).join('')}</div>`;
  if (isPhone()) return `<div class="tiles" id="tiles">${d.opts.map((o,i) => tile(d,i)).join('')}</div>
    <div class="swipe-dots dots" id="swipeDots">${d.opts.map((o,i)=>`<i aria-current="${i===state.slide}"></i>`).join('')}</div>`;
  if (n < MAX_OPTIONS) return `<div class="tiles" style="--n:${n}" data-n="${n}">${d.opts.map((o,i) => tile(d,i)).join('')}</div>`;
  const pair = comparePair(d), rest = byConfidence(d).filter(i => !pair.includes(i));
  const picker = (slot) => `<label>Vergleichen mit <select id="cmp-${slot}" data-cmp="${slot}">${d.opts.map((o,i)=>`<option value="${i}" ${pair[slot]===i?'selected':''} ${pair[1-slot]===i?'disabled':''}>${esc(o.a)} · ${o.p} %</option>`).join('')}</select></label>`;
  return `<div class="cmp-pick">${picker(0)}${picker(1)}</div>
    <div class="tiles" style="--n:2" data-n="2">${pair.map(i => tile(d,i)).join('')}</div>
    <div class="minis">${rest.map(i => { const o = d.opts[i]; return `<div class="mini">
      <button class="tile-open" data-swap="${i}" aria-label="${esc(o.a)} in den Vergleich holen"></button>
      <span class="thumb">${o.soll?scene(o.soll):''}</span><span class="ans">${esc(o.a)}</span>
      <span class="side"><span class="pct">${o.p} %</span><button class="take" data-take="${i}">Nehmen</button></span>
      <span class="row2"><span class="folge">${esc(o.f)}</span>${blockRow(d,o)}</span></div>`; }).join('')}</div>`;
}

/* ---------- stage ---------- */
function askPanel(d){
  const own = state.ask.has('own');
  return `<div class="ask" id="askPanel"><div class="ask-h">Was fehlt dir?<small>Die Frage geht zurück an ${d.from} und wartet, bis die Antwort ergänzt ist.</small></div>
    <div class="chips">${ASK_REASONS.map(([k,l]) => `<button data-reason="${k}" aria-pressed="${state.ask.has(k)}">${k==='own'?ICON.pen:ICON[k]}${l}</button>`).join('')}</div>
    ${own?`<textarea id="askText" placeholder="z. B. Was kostet ein Spam-Filter?"></textarea>`:''}
    <div class="ask-foot"><button class="btn-s" data-askcancel>Abbrechen</button><button class="btn-p" data-asksend ${state.ask.size?'':'disabled'}>Zurückschicken</button></div></div>`;
}
function renderStage(){
  const st = document.getElementById('stage');
  const d = byId(state.openId);
  document.getElementById('decide').classList.toggle('open', state.phoneOpen && !!d);
  if (!d){ st.innerHTML = `<div class="stage-in"><p class="question">Alles entschieden.</p><p class="situation">Neue Fragen erscheinen links, sobald ein Agent eine stellt.</p></div>`; renderTakebar(); return; }
  const ro = state.readOnly === d.id;
  const legend = ro ? '' : slotsOf(d).map(k => `<span class="k"><span class="bk">${ICON[k]}</span>${BLOCK_LABEL[k]}</span>`).join('')
    + `<span class="k"><span class="bk off">${ICON.bsp}</span>fehlt</span>`;
  const actions = ro
    ? (roState(d)==='end' ? '' : `<div class="actions"><button class="btn-s" data-change="${d.id}">${ICON.pen}Ändern</button></div>`)
    : `<div class="actions"><button>${ICON.pen}Eigene Antwort</button><button>${ICON.talk}Diskutieren</button><button data-ask aria-expanded="${state.askOpen}">${ICON.ask}Mehr Info anfordern</button>
      <span class="legend">${legend}${infoTip('req', `Pflicht bei Einsatz <b>${STAKE[d.stake]}</b>, Typ <b>${d.type}</b>: ${requiredText(d)}. Fehlt ein Pflichtbaustein, nimmt das Board die Frage nicht an. Gestrichelt heißt: fehlt, aber freiwillig.`)}</span></div>`;
  st.innerHTML = `<div class="stage-in">
    <button class="back" data-back>${sized(ICON.back,16)} Liste</button>
    <div class="eyebrow"><b>${d.proj}</b><span class="tchip">${TYPE[d.type].icon}${d.type}</span><span>Einsatz ${STAKE[d.stake]}</span>${stakeMark(d.stake)}${d.blocked?`<span class="block">blockiert ${d.blocked}</span>`:''}<span>· von ${d.from}</span>${ro?`<span class="state ${roState(d)}">${STATE_LABEL[roState(d)]}</span>`:''}</div>
    <div><p class="situation">${esc(d.situation)}</p><h1 class="question">${esc(d.q)}</h1></div>
    ${!ro && d.waiting?`<div class="waitbanner">${ICON.wait}<span>Zurück bei <b>${d.waiting.to}</b> · ${esc(d.waiting.reasons.join(', '))}${d.waiting.text?`: „${esc(d.waiting.text)}“`:''} · ${d.waiting.age}</span><button class="linkbtn" data-recall>Zurückholen</button></div>`:''}
    ${d.ist?`<details class="ist" open style="--ist-w:${TYPE[d.type].istW}"><summary><span class="ist-lab">So ist es heute</span><span class="chev">${ICON.chev}</span></summary>
      <div class="ist-body"><p class="ist-cap">${esc(d.ist.cap)}<small>${esc(d.ist.note)}</small></p>${scene(d.ist.scene)}</div></details>`:''}
    <div class="optsbar"><h3>${d.ist?'So soll es sein':'Optionen'} · ${d.opts.length}</h3>${ro?'':infoTip('max', `Höchstens <b>${MAX_OPTIONS} Optionen</b> plus Eigene Antwort. Mehr muss der Agent gruppieren oder in zwei Schritte teilen.`)}</div>
    ${optionsBlock(d)}
    <div class="why"><b>Warum ${esc(d.opts[d.rec].a)}?</b><span>${esc(d.why)}</span></div>
    ${actions}
    ${!ro && state.askOpen?askPanel(d):''}
  </div>`;
  bindCarousel();
  renderTakebar();
}
function bindCarousel(){
  const strip = document.getElementById('tiles');
  if (!strip) return;
  state.slide = Math.min(state.slide, byId(state.openId).opts.length-1);
  strip.addEventListener('scroll', () => {
    const card = strip.querySelector('.tile'); if (!card) return;
    const idx = Math.round(strip.scrollLeft / (card.offsetWidth + 12));
    if (idx !== state.slide){ state.slide = idx; document.querySelectorAll('#swipeDots i').forEach((dot,k) => dot.setAttribute('aria-current', k===idx)); renderTakebar(); }
  }, {passive:true});
}
function renderTakebar(){
  const bar = document.getElementById('takebar');
  const d = byId(state.openId);
  const show = isPhone() && state.view==='decide' && state.phoneOpen && d && state.ovIdx===null && !state.readOnly;
  bar.hidden = !show;
  if (!show) return;
  const o = d.opts[state.slide], rec = state.slide === d.rec;
  bar.innerHTML = `<span class="tb-t"><b>${esc(o.a)}</b><span>${state.slide+1} von ${d.opts.length} · ${o.p} %${rec?' · empfohlen':''}</span></span><button class="btn-p${rec?' rec':''}" data-take="${state.slide}">Nehmen</button>`;
}
</script>
<script>
/* ---------- full-screen option view: Heute · Soll · in 4 Wochen ---------- */
function renderOverlay(){
  const ov = document.getElementById('ov');
  const d = byId(state.openId);
  if (state.ovIdx === null || !d){ ov.hidden = true; renderTakebar(); return; }
  const i = state.ovIdx, o = d.opts[i], rec = i === d.rec;
  const frames = [...(d.ist?[['ist','Heute']]:[]), ['soll', d.ist?'So soll es sein':'Bild'], ...(o.zeit?[['zeit','In 4 Wochen']]:[])];
  if (!frames.some(([k]) => k === state.ovFrame)) state.ovFrame = 'soll';
  const pic = {ist:[d.ist?.scene, d.ist?.cap], soll:[o.soll, o.a], zeit:[o.zeit?.scene, o.zeit?.cap]}[state.ovFrame];
  ov.hidden = false;
  ov.innerHTML = `
    <div class="ov-top"><button class="navarrow" data-close aria-label="Zurück">${sized(ICON.back,18)}</button>
      <span class="q">${esc(d.q)}</span>
      <span class="dots">${d.opts.map((x,k)=>`<button data-go="${k}" aria-label="${esc(x.a)}" aria-current="${k===i}"></button>`).join('')}</span></div>
    <div class="ov-body"><div class="ov-in">
      <div class="ov-pic${state.ovFrame==='zeit'?' future':''}">
        ${frames.length>1?`<div class="tseg" role="group" aria-label="Zeitpunkt">${frames.map(([k,l]) => `<button data-frame="${k}" aria-pressed="${state.ovFrame===k}">${l}${k==='zeit'?` <em class="prog">Prognose ${o.p} %</em>`:''}</button>`).join('')}</div>`:''}
        ${pic[0]?scene(pic[0]):''}<p class="ov-cap">${esc(pic[1]??'')}</p></div>
      <div class="ov-text">
        <div class="facts">${rec?'<span class="chip recc">Empfohlen</span>':''}<span class="chip mono">${o.p} %</span><span class="chip">${o.eff}</span><span class="chip ${o.rev==='umkehrbar'?'good':'warn'}">${o.rev}</span></div>
        <h2 class="ans">${esc(o.a)}</h2>
        ${o.ex?`<div><div class="lab">Beispiel</div><p class="story">${esc(o.ex)}</p></div>`:''}
        <div><div class="lab">Folge</div><p class="folge">${esc(o.f)}</p></div>
        ${o.zeit?`<div><div class="lab">Zeitreise <em class="prog">Prognose ${o.p} %</em></div><p class="folge">${esc(o.zeit.cap)}</p></div>`:''}
        ${rec?`<div class="why"><b>Warum?</b><span>${esc(d.why)}</span></div>`:''}
        <div>${blockRow(d,o)}</div>
      </div>
    </div></div>
    <div class="ov-foot"><span class="hint"><span class="kbd">←</span> <span class="kbd">→</span> Optionen · <span class="kbd">Esc</span> zurück</span>
      <button class="navarrow" data-go="${i-1}" ${i===0?'disabled':''} aria-label="Vorige">${sized(ICON.back,18)}</button>
      <button class="navarrow" data-go="${i+1}" ${i===d.opts.length-1?'disabled':''} aria-label="Nächste">${sized(ICON.next,18)}</button>
      <button class="btn-s" data-close>Zurück</button>
      <button class="btn-p${rec?' rec':''}" data-take="${i}">Nehmen</button></div>`;
  renderTakebar();
}

/* ---------- take, undo, ask ---------- */
function showToast(msg, undo){
  const t = document.getElementById('toast');
  clearTimeout(state.toastTimer);
  t.innerHTML = `<span class="msg">${esc(msg)}</span><button data-undo>Rückgängig</button><span class="bar"></span>`;
  t.hidden = false;
  t.querySelector('[data-undo]').onclick = () => { undo(); t.hidden = true; };
  state.toastTimer = setTimeout(() => t.hidden = true, 8000);
}
function choose(id, idx){
  const d = byId(id);
  state.done = state.done.filter(x => x.id !== id).concat({id, idx});
  state.ovIdx = null; state.phoneOpen = false; state.slide = 0;
  renderAll();
  showToast(`${d.title}: ${d.opts[idx].a}`, () => { state.done = state.done.filter(x => x.id !== id); state.openId = id; renderAll(); });
}
function sendAsk(){
  const d = byId(state.openId);
  const reasons = ASK_REASONS.filter(([k]) => state.ask.has(k)).map(([,l]) => l);
  d.waiting = {to:d.from, reasons, text:document.getElementById('askText')?.value.trim() || '', age:'gerade eben'};
  state.ask.clear(); state.askOpen = false; state.phoneOpen = false; state.openId = null;
  renderAll();
  showToast(`Zurück an ${d.from}: ${reasons.join(', ')}`, () => { delete d.waiting; state.openId = d.id; renderAll(); });
}

/* ---------- Verlauf + Status ---------- */
function renderHistory(){
  const L = {offen:'offen', arbeit:'in Arbeit', um:'umgesetzt', end:'endgültig'};
  const I = {offen:'<circle cx="12" cy="12" r="8"/>', arbeit:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>', um:'<path d="M5 12l5 5 9-10"/>', end:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'};
  const today = state.done.map(x => { const d = byId(x.id); return {q:d.q, proj:d.proj, a:d.opts[x.idx].a, state:'offen', age:'heute', change:true, id:d.id}; });
  document.getElementById('histRows').innerHTML = [...today, ...HIST].map(h => `
    <div class="row" data-viewro="${h.id}"><span class="q">${esc(h.q)}</span>
      <span class="state ${h.state}">${svg(I[h.state])}${L[h.state]}</span>
      <span class="slot">${h.change?`<button class="linkbtn" data-change="${h.id}">Ändern</button>`:'<span class="lock-note">fest</span>'}</span>
      <span class="a"><b>${esc(h.a)}</b> · ${h.proj} · <span class="sub">${h.age}</span></span></div>`).join('');
}
function renderStatus(){
  const money = c => c.toFixed(2).replace('.', ',') + ' €';
  const tok = n => n >= 1000 ? Math.round(n/1000) + 'k' : String(n);
  const sessions = s => s.sessions.map(x => `<div class="sess"><span class="agent-t">${esc(x.agent)}</span><span>${x.min} min</span><span>${tok(x.tokens)} Token</span><span class="cost">${money(x.cost)}</span></div>`).join('');
  const vh = (s, reason, action) => `<details class="vh">
    <summary><span class="vh-name">${esc(s.proj)}<span class="chev">${ICON.chev}</span></span>
      ${action ?? '<span></span>'}
      <span class="vh-reason${s.cat==='haengt'?' bad':''}">${reason}</span></summary>
    <div class="vh-sessions">${sessions(s)}</div></details>`;
  const byCat = c => STATUS.filter(s => s.cat === c);
  const hangt = byCat('haengt'), wartet = byCat('wartet'), laeuft = byCat('laeuft'), ruhig = byCat('ruhig');
  const sections = [];
  if (hangt.length) sections.push(`<div class="status-sec"><h2 class="sec-h hangt">Hängt</h2>${hangt.map(s =>
    vh(s, esc(s.reason), `<button class="jump hot">In Session springen</button>`)).join('')}</div>`);
  if (wartet.length) sections.push(`<div class="status-sec"><h2 class="sec-h">Wartet auf dich</h2>${wartet.map(s =>
    vh(s, esc(s.reason), `<button class="jump" data-open-decision="${s.decisionId}">Zur Entscheidung</button>`)).join('')}</div>`);
  if (laeuft.length) sections.push(`<div class="status-sec"><h2 class="sec-h">Läuft</h2>${laeuft.map(s =>
    vh(s, `<span class="agent-t">${esc(s.agent)}</span> läuft seit ${s.min} min`)).join('')}</div>`);
  if (ruhig.length) sections.push(`<details class="ruhig-group"><summary>Ruhig (${ruhig.length})<span class="chev">${ICON.chev}</span></summary>${ruhig.map(s =>
    vh(s, esc(s.reason))).join('')}</details>`);
  document.getElementById('statusRows').innerHTML = sections.join('');
}
function renderAll(){
  for (const v of ['decide','history','status']) document.getElementById('v-'+v).hidden = state.view!==v;
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.view===state.view?'page':'false'));
  renderTracks(); renderStage(); renderOverlay(); renderHistory(); renderStatus();
}

/* ---------- events ---------- */
function openDecision(id){ state.readOnly = null; state.openId = id; state.phoneOpen = true; state.askOpen = false; state.ask.clear(); state.slide = 0; renderTracks(); renderStage(); document.getElementById('stage').scrollTop = 0; window.scrollTo(0,0); }
function openReadOnly(id){ state.readOnly = id; state.openId = id; state.view = 'decide'; state.phoneOpen = true; state.askOpen = false; state.ask.clear(); state.ovIdx = null; state.slide = 0; renderAll(); document.getElementById('stage').scrollTop = 0; window.scrollTo(0,0); }
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t){
    const ro = e.target.closest('[data-viewro]');
    if (ro){ openReadOnly(ro.dataset.viewro); return; }
    document.querySelectorAll('.info.open').forEach(x => x.classList.remove('open'));
    return;
  }
  const ds = t.dataset;
  if (t.classList.contains('info-btn')){ const box = t.parentElement; box.classList.toggle('open'); t.setAttribute('aria-expanded', box.classList.contains('open')); return; }
  if (ds.view){ state.view = ds.view; state.ovIdx = null; renderAll(); window.scrollTo(0,0); return; }
  if (ds.mode){ state.mode = ds.mode; state.focus = null; renderTracks(); return; }
  if (ds.focus){ state.focus = ds.focus; renderTracks(); renderStage(); return; }
  if (ds.unfocus !== undefined){ state.focus = null; renderTracks(); renderStage(); return; }
  if (t.classList.contains('track')){ openDecision(ds.id); return; }
  if (ds.back !== undefined){ state.phoneOpen = false; renderStage(); return; }
  if (ds.opt){ state.ovIdx = +ds.opt; state.ovFrame = 'soll'; renderOverlay(); return; }
  if (ds.swap){ const d = byId(state.openId); comparePair(d)[1] = +ds.swap; renderStage(); return; }
  if (ds.frame){ state.ovFrame = ds.frame; renderOverlay(); return; }
  if (ds.close !== undefined){ state.ovIdx = null; renderOverlay(); return; }
  if (ds.go !== undefined){ const n = +ds.go, d = byId(state.openId); if (n>=0 && n<d.opts.length){ state.ovIdx = n; renderOverlay(); } return; }
  if (ds.take !== undefined){ choose(state.openId, +ds.take); return; }
  if (ds.change){ state.done = state.done.filter(x => x.id !== ds.change); state.view = 'decide'; state.focus = null; renderAll(); openDecision(ds.change); return; }
  if (ds.openDecision){ state.view = 'decide'; state.focus = null; renderAll(); openDecision(ds.openDecision); return; }
  if (ds.ask !== undefined){ state.askOpen = !state.askOpen; renderStage(); document.getElementById('askPanel')?.scrollIntoView({block:'nearest'}); return; }
  if (ds.reason){ state.ask.has(ds.reason) ? state.ask.delete(ds.reason) : state.ask.add(ds.reason); const keep = document.getElementById('askText')?.value; renderStage(); const ta = document.getElementById('askText'); if (ta && keep) ta.value = keep; return; }
  if (ds.askcancel !== undefined){ state.askOpen = false; state.ask.clear(); renderStage(); return; }
  if (ds.asksend !== undefined){ sendAsk(); return; }
  if (ds.recall !== undefined){ const d = byId(state.openId); delete d.waiting; renderTracks(); renderStage(); return; }
});
document.addEventListener('change', e => {
  const sel = e.target.closest('select[data-cmp]'); if (!sel) return;
  const d = byId(state.openId); comparePair(d)[+sel.dataset.cmp] = +sel.value; renderStage();
});
document.addEventListener('keydown', e => {
  if (state.ovIdx === null) return;
  const d = byId(state.openId);
  if (e.key === 'ArrowRight' && state.ovIdx < d.opts.length-1){ state.ovIdx++; renderOverlay(); }
  else if (e.key === 'ArrowLeft' && state.ovIdx > 0){ state.ovIdx--; renderOverlay(); }
  else if (e.key === 'Escape'){ state.ovIdx = null; renderOverlay(); }
});
phoneQuery.addEventListener('change', () => { state.slide = 0; renderStage(); });

/* deep links for review: #d-c opens a decision, #ov-a-0 an option, #proj groups, #focus-songmaker, #ask, #ro-h0 a read-only decision, #v-status */
(function fromHash(){
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^d-(\w)$/))) { state.openId = m[1]; state.phoneOpen = true; }
  else if ((m = h.match(/^ov-(\w)-(\d)$/))) { state.openId = m[1]; state.phoneOpen = true; state.ovIdx = +m[2]; }
  else if ((m = h.match(/^zr-(\w)-(\d)$/))) { state.openId = m[1]; state.phoneOpen = true; state.ovIdx = +m[2]; state.ovFrame = 'zeit'; }
  else if (h === 'proj') state.mode = 'proj';
  else if ((m = h.match(/^focus-([\w-]+)$/))) { state.mode = 'proj'; state.focus = m[1]; }
  else if ((m = h.match(/^ask-(\w)$/))) { state.openId = m[1]; state.phoneOpen = true; state.askOpen = true; state.ask.add('bsp'); }
  else if ((m = h.match(/^ro-(\w+)$/))) { state.readOnly = m[1]; state.openId = m[1]; state.phoneOpen = true; }
  else if ((m = h.match(/^v-(history|status)$/))) state.view = m[1];
  renderAll();
})();
</script>
</body>
</html>
